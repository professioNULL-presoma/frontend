name: ci
on:
  push:
  pull_request:
jobs:
  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: No AI tool attribution
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            scripts/check-attribution.sh "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              scripts/check-attribution.sh "${{ github.sha }}"
            else
              scripts/check-attribution.sh "$before..${{ github.sha }}"
            fi
          fi
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run build
